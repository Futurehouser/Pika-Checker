name: Release

# Publish a new version either by pushing a tag (git tag v1.2.0 && git push origin v1.2.0)
# or from the Actions tab with "Run workflow" and a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; V="${V#v}"; fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Version must look like 1.2.3, got '$V'"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks

      - name: Test and build signed APK
        env:
          SIGNING_STORE_FILE: signing/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PappVersion=${{ steps.version.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk PikaChecker-v${{ steps.version.outputs.version }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.version }}
          gh release create "v$V" "PikaChecker-v$V.apk" \
            --title "Pika Checker v$V" \
            --target "$GITHUB_SHA" \
            --generate-notes
